name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_feeding_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  forecasting:
    name: Forecasting tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecasting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            forecasting/requirements.txt
            forecasting/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write a throwaway .env
        run: |
          {
            echo "PGPASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "LOAD_DEMO_DATA=true"
          } > .env
      - name: Check the HTTPS production file
        run: |
          DOMAIN=lishe.example.org docker compose -f docker-compose.yml -f docker-compose.prod.yml config > prod-config.yml
          # Only Caddy may publish ports on the public server
          test "$(grep -c 'published:' prod-config.yml)" = "3"
          grep -q 'FRONTEND_URL: https://lishe.example.org' prod-config.yml
          grep -q 'WEBAUTHN_RP_ID: lishe.example.org' prod-config.yml
          grep -q 'WEBAUTHN_ORIGINS: https://lishe.example.org' prod-config.yml
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        env:
          BASE_URL: http://localhost:8080
          SMOKE_EMAIL: admin@demo-school.local
          SMOKE_PASSWORD: ChangeMeAdmin1
        run: node deploy/smoke-test.mjs
      - name: Create an administrator with the script, then sign in as them
        run: |
          docker compose exec -T -e ADMIN_PASSWORD=ci-admin-password-1 backend \
            node scripts/create-admin.js --name "CI Admin" --email ci-admin@example.org
          SMOKE_EMAIL=ci-admin@example.org SMOKE_PASSWORD=ci-admin-password-1 BASE_URL=http://localhost:8080 \
            node deploy/smoke-test.mjs
      - name: Migrations can be applied to the running database
        run: |
          for file in database/migrations/*.sql; do
            docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "/database/migrations/$(basename "$0")"' "$file" > /dev/null
            echo "applied $file"
          done
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
