# Lishe: database, API, review scoring service and web app with one command.
#
#   copy .env.example .env      (then set PGPASSWORD and JWT_SECRET)
#   docker compose up --build
#   open http://localhost:8080
#
# For a public server with HTTPS, add docker-compose.prod.yml (see docs/deployment.md).

name: lishe

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # The PostgreSQL image's own setting names, filled from the PG* values in .env
      POSTGRES_DB: ${PGDATABASE:-school_feeding_db}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-false}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Schema, seed and migrations, read-only; init.sh runs on the first start only
      - ./database:/database:ro
      - ./database/docker/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  scoring:
    build: ./forecasting
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD}@db:5432/${PGDATABASE:-school_feeding_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SCORING_SERVICE_URL: http://scoring:5001
      SCORING_TIMEOUT_MS: ${SCORING_TIMEOUT_MS:-30000}
      # Scores each sub-county's finished weeks for the weekly review list by itself
      REVIEW_SCHEDULE: ${REVIEW_SCHEDULE:-on}
      REVIEW_SCHEDULE_MINUTES: ${REVIEW_SCHEDULE_MINUTES:-60}
      # Applied on start-up (backend/src/db/migrate.js). Only for a database migrated by
      # hand before that: the last script it already has, set once
      MIGRATIONS_BASELINE: ${MIGRATIONS_BASELINE:-}
      # The browser reaches the API through the web container (same origin), so CORS only
      # matters if the API is called from elsewhere
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Administrator passkeys belong to this domain and may only be used from this origin
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGINS: http://localhost:${WEB_PORT:-8080}
      # Email (activation codes, device approvals). Locally it goes to Mailpit, a test
      # mailbox at http://localhost:8025, so nothing reaches a real inbox
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Lishe <no-reply@lishe.local>}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      # The migration scripts the API applies when it starts, read-only
      - ./database/migrations:/database/migrations:ro
    depends_on:
      db:
        condition: service_healthy
      scoring:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

  # A local test mailbox: catches every email the API sends and shows it at
  # http://localhost:8025. Not used on a public server (docker-compose.prod.yml)
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # A database backup every day into ./backups, keeping the last BACKUP_KEEP_DAYS
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:-school_feeding_db}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
