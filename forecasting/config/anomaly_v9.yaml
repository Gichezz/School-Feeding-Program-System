# Protocol version 9: investigating further improvements to the weekly review list.
#
# Part A (this file as first committed) is written and committed before any version 9
# analysis is run. It fixes what the investigation may look at and how. Part B (the at most
# three changes to test, their margins and the final evaluation) is added to this file
# after the investigation report is reviewed and approved, and committed before any
# experiment runs.
#
# Version 8 is the baseline: Extended Isolation Forest, one model per sub-county refitted
# every 20 school days on its last 125, a school's week scored as the mean of its two
# highest days, review threshold q = 0.98, at most 3 school-weeks per officer-week.
#
# Why version 9 changes how it is judged. The 2026 test year has now been looked at for
# versions 7 and 8, and version 8's 2026 errors were broken down by type. Designing fixes
# from 2026 would tune on the test year. So version 9 develops on 2025 only and is judged
# once on fresh datasets, generated with seeds never used before, that nobody has looked
# at. 2026 of the existing datasets stays for comparison with earlier versions only.

version: 9
part: A
baseline: version 8 (config/anomaly_v8.yaml, data/reports/anomaly/v8)

# What each year is for. Nothing in Part A reads 2026 of any dataset.
periods:
  training_for_the_diagnostic: {start: 2024-01-01, end: 2024-12-31}
  development: {start: 2025-01-06, end: 2025-12-31}     # error analysis and every choice
  never_read_in_part_a: {start: 2026-01-01, end: 2026-12-31}

# The existing datasets (main and seeds 101, 202, 303) and model seeds 1-5, as version 8.
data: the version 8 deployment datasets
# 2024 and 2025 hold only three of the six problem types (consumption drift, inflated
# headcount, stock leakage); the other three are held out until each dataset's 2026 by
# design. So the investigation describes those three types only, and says so.
types_in_development: [consumption_drift, inflated_headcount, stock_leakage]

investigation:
  1_feature_inventory: >
    Every existing feature: what it measures, the type of problem it is meant to show, and
    how well it separates problem school-days from ordinary ones in 2025 (area under the
    ROC curve, alone), per type present.
  2_capacity_check: >
    Problem school-weeks per sub-county-week in 2025, how often a week holds more than 3,
    and the best Precision@3, Recall@3 and F1@3 a perfect list of at most 3 could reach.
  3_error_analysis: >
    Version 8 run as deployed over 2025 (the version 8 runner's loop, q = 0.98), keeping
    each school-week's score, rank and the threshold. Missed problem school-weeks and
    ordinary school-weeks listed (false listings), each broken down by type, school size,
    sub-county, programme type, how long the problem ran, how many of its days fell in
    the week, and weeks since it began; and why a missed one was missed (below the
    threshold, or above it but outranked by 3 others).
  4_temporal_signals: >
    From the same daily scores: days in the week above the training window's 90th
    percentile of daily scores, the longest run of such consecutive days, the previous
    week's weekly score (recurrence), the change from the previous week (trend), and the
    week against the school's own earlier weeks. Each compared with the top-2 mean by how
    well it separates problem school-weeks (area under the ROC curve) and by Precision@3,
    Recall@3 and F1@3 when ranked with the same threshold rule.
  5_calibration: >
    Whether a school-week's raw score means the same in every sub-county and through the
    year: its percentile within its own model's training-window school-weeks, against the
    raw score, by sub-county and by term.
  6_detectability_diagnostic: >
    A labelled model (histogram gradient boosting, default settings, no tuning) trained on
    2024's school-days with their labels and evaluated on 2025: area under the ROC and
    precision-recall curves on school-days, and Precision@3, Recall@3 and F1@3 on
    school-weeks (top-2 mean, at most 3 per sub-county-week, threshold chosen on 2024).
    It is a benchmark of how much the features can tell problems apart, not a ceiling
    (a better model could do better) and not part of the system: real schools have no
    labels. It is compared with version 8 on the same 2025 school-weeks.

# Fixed now for Part B, whatever the investigation finds
rules_for_part_b:
  at_most: 3 changes, tested in order, chosen on 2025, as version 8
  margins: version 8's (1.0 F1@3 point; 2.0 for any change adding models)
  co_primary: [problems_caught, weeks_to_catch, f1_at_k]
  problem: >
    one injected episode: one school, one type, from its first to its last day. Caught if
    any school-week it covers is listed. Weeks to catch: school weeks from the episode's
    first week to the first listing (0 = its first week). Caught within 2 weeks: 0 or 1.
  no_labels_in_the_system: >
    a change may learn only from what the system has: the records, and officers' follow-up
    and explained decisions as simulated by the deployment loop. The injected labels are
    used only to measure.
  robustness_limits: >
    a change is rejected if, on the robustness scenarios, Extended Isolation Forest's
    average rank worsens by more than 0.25, any scenario's rank by more than 1.0, or any
    group's false listing ratio exceeds 1.5
  final_evaluation: >
    10 fresh datasets from the main configuration with seeds never used before, generated
    only after Part B's settings are frozen and committed, each scored once over its 2026
    (all six types), with 5 model seeds; version 8 scored on the same data.

outputs: forecasting/data/reports/anomaly/v9_investigation/
code: forecasting/scripts/v9_investigation/   # new files only; existing code and reports untouched

# ---------------------------------------------------------------------------------------
# Part B. Added after the investigation report (data/reports/anomaly/v9_investigation/
# v9_investigation_report.md) was reviewed and approved, and committed before any part B
# experiment runs.
# ---------------------------------------------------------------------------------------
part_b:
  benchmark_qualified: >
    The investigation's labelled benchmark (HistGradientBoostingClassifier, default
    settings, random_state 0; trained on 2024 school-days with their labels, 5-fold
    cross-validation grouped by school on 2024 to choose its weekly threshold; evaluated on
    2025) reached about 70% F1@3. 2024 holds the same three types as 2025 in the same
    numbers in every dataset (5 consumption drift, 5 inflated headcount and 4 stock leakage
    episodes), so its training data is representative of what it was evaluated on. It is
    evidence that these features and this approach have difficulty reaching 80% F1@3, not a
    proven ceiling.

  development: 2025 only (2025-01-06 to 2025-12-31); the deployment loop is stopped at the
    end of 2025, so no part of 2026 is scored or read until the final test.

  # Each change is tested in this order. Within each, the review threshold q is re-chosen
  # from [none, 0.90, 0.95, 0.98] by F1@3 on 2025 (ties to the lower q).
  changes:
    - name: change_1_over_recording
      margin_f1_points: 2.0          # it adds a second scoring signal
      what: >
        A second, unsupervised signal for learners fed recorded above what the school's
        enrolment, its peers and its own last term would suggest. For each school-day,
        over_recording = the mean of two robust z-scores, each one-sided (below 0 counts as
        0): fed_vs_peers_trend (learners fed against similar schools nearby, 10-day mean,
        an existing candidate feature) and the 10-day mean of fed_rate_vs_last_term. Each
        z-score uses the median and 1.4826 x MAD of that quantity over the model's training
        window (the sub-county's last 125 school days, as the isolation model).
        Combined with the isolation model at the level of the school-day: day score = the
        mean of the isolation score's percentile and over_recording's percentile among the
        training window's school-days. The weekly score (top-2 day mean), the review
        threshold and the list are then built exactly as in version 8. No labels are used.
      growth_test: >
        A behaviour test: a school whose enrolment and learners fed rise together (real
        growth, the share fed unchanged) must not have its over_recording raised.
      report: results by school size and by sub-county
    - name: change_2_store_gap
      margin_f1_points: 1.0
      what: >
        count_gap_recent (the last store count's gap with the records, carried on the 9
        school days after the count; built and tested in version 8) added to the isolation
        model's features, on top of change 1's decision.
      wording: >
        a gap is an unexplained stock variance ("the last store count N days of food short
        of the records"), never stated as leakage or misconduct
      frequency_check: the robustness scenario with fortnightly store counts
    - name: change_3_persistence
      margin_f1_points: 1.0
      optional: adopted only if it meets every rule below
      what: >
        A school-week is also listed if its weekly score is above the 90th percentile of
        the training window's school-week scores (the same population as the review
        threshold) this week and the week before. Schools above the review threshold are
        listed first, then persistent ones, at most 3 in all. A school listed the week
        before is not listed through this route (it can still be listed through the review
        threshold), so it does not repeat alerts for a problem already being looked into.

  # A change is adopted only if, on 2025, against the current setting, it meets all of:
  adoption_rules:
    f1_at_k: gains at least the change's margin (mean over 4 datasets x 5 model seeds)
    problems_caught: does not fall
    workload: ordinary schools listed per officer-term rises by no more than 1.0
    fairness: no group (school size, programme type, sub-county, sync interval, outage week)
      over 1.5 times the overall false listing rate
  robustness_after_development: >
    The setting reached after the three changes is run in the robustness scenarios
    (config/anomaly_robustness.yaml) as a method next to the others. It is rejected if its
    average rank is worse than version 8's Extended Isolation Forest (1.43) by more than
    0.25, or if in any scenario its rank is worse than Extended Isolation Forest's version
    8 rank in that scenario by more than 1.0. If rejected, the last adopted change is
    removed and the check repeated.

  freeze: >
    Before the fresh datasets are generated, the final setting (method, features,
    combination, q, listing rule) and the generator's code version (git commit of
    scripts/generate_feeding_dataset.py and config/feeding_dataset.yaml) are written below
    and committed.

  final_evaluation:
    datasets: 10 fresh datasets from config/feeding_dataset.yaml with seeds 9001-9010, never used before
    period: each dataset's 2026 (2026-01-01 to 2026-10-23), all six types; the loop runs
      from 2025 so the first fits have history, and only 2026 is measured
    model_seeds: [1, 2, 3, 4, 5]
    compared: version 8 (as deployed) and version 9 (frozen), on the same datasets and seeds
    measures:
      - precision_at_k
      - recall_at_k
      - f1_at_k
      - problems_caught            # an episode: one school, one type, first to last day; caught if any school-week it covers is listed
      - problems_caught_within_2_weeks   # weeks to catch 0 or 1 (0 = the episode's first week)
      - median_weeks_to_catch
      - false_listings_per_officer_term
      - listings_per_officer_week
      - listed_by_type and caught_by_type, all six types
      - fairness by group
    uncertainty: >
      each dataset's result, the mean, the standard deviation across datasets, and 95%
      intervals from 2,000 bootstrap resamples of the 10 datasets, for each measure and for
      the version 9 minus version 8 difference
    reported_whatever_it_shows: >
      The result is reported as it comes out. No expectation is set that it will be higher
      or lower than 2025's or 2026's figures, and nothing is changed after it is seen.

# ---------------------------------------------------------------------------------------
# Freeze. Written after the part B development stages (data/reports/anomaly/v9/
# development.json) and committed before any fresh dataset is generated.
#
# No change met every adoption rule on 2025:
#   change 1 (over-recording): F1@3 -7.6 points; problems caught fell (78.6% to 58.2%).
#     Inflated headcount weeks listed rose (16% to 70%), but consumption drift (63% to 16%)
#     and stock leakage (30% to 6%) fell: averaging halves the isolation model's signal on
#     days only it picks up.
#   change 2 (store gap): +0.4 points, under the 1.0 margin.
#   change 3 (persistence): +0.4 points, under the margin, and +1.3 ordinary schools listed
#     per officer-term against the limit of 1.0 (problems caught rose, 78.6% to 91.1%).
# So version 9 is version 8. The robustness check is not needed: the setting is version 8's,
# already checked. The final test still runs, once, as an independent estimate of the
# deployed list on data nobody has looked at; version 8 and version 9 are the same run.
# ---------------------------------------------------------------------------------------
frozen:
  method: extended_isolation_forest
  features: [fed_rate, fed_vs_own, fed_vs_peers, fed_rate_vs_last_term, enrolment_change, uptake, cereal_ratio,
             pulse_ratio, usage_trend, count_gap_change, entry_delay, entry_batch, after_hours_share, round_share,
             fed_steadiness]
  weekly_score: top2_mean
  q: 0.98
  persistence: false
  same_as: version 8
  generator_commit: 050703a0063efe39f7c2d1dab57e303e0605e50d
