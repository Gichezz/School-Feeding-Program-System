# ---------------------------------------------------------------------------
# Forecasting configuration (Phase 10)
#
# Used by:
#   scripts/evaluate_forecasting_models.py  (rolling-origin validation + test,
#                                            Prophet vs baselines and alternatives)
#   scripts/train_forecasting_model.py      (final model artifact)
#   app.py / services/forecast_service.py   (Flask API)
#
# The data is SYNTHETIC (one simulated Kenyan school). Nothing here has been
# validated against real Kenyan school records.
# ---------------------------------------------------------------------------

dataset:
  path: data/processed/synthetic_kenya_school_daily.csv   # relative to forecasting/
  date_column: date
  target: estimated_meal_demand
  school_day_column: is_school_day

# Chronological split (inclusive dates). Validation selects/tunes models;
# the test period is used once, for the final comparison.
split:
  train: {start: "1998-01-01", end: "2021-12-31"}
  validation: {start: "2022-01-01", end: "2023-12-31"}
  test: {start: "2024-01-01", end: "2025-12-31"}

evaluation:
  # A forecast origin is the date a forecast is made, using data up to the
  # previous day. Origins are placed every `origin_step_days` calendar days.
  origin_step_days: 14
  horizons_days: [7, 14, 30]        # calendar days ahead; only school days are scored
  selection_metric: mae             # averaged over all horizons on validation
  mape_min_actual: 1.0              # actuals below this are excluded from MAPE

horizon:
  default_days: 14
  min_days: 1
  max_days: 60
  # The API refuses start dates further than this beyond the training data.
  max_days_after_training_end: 730

baselines:
  historical_average:
    # expanding = all previous school days; trailing = previous N calendar days
    variants:
      - {name: expanding}
      - {name: trailing_365d, window_days: 365}
  moving_average:
    windows_school_days: [5, 10, 20]

prophet:
  random_seed: 20250901
  interval_width: 0.80
  coverage_levels: [0.80, 0.95]
  uncertainty_samples: 1000
  # Regressors that can be supplied for any future date:
  #   calendar flags come from the configured school calendar
  #   (config/synthetic_kenya_school.yaml); enrollment comes from school
  #   records (last known value, held constant over the horizon).
  # Rainfall, attendance, meals and special events are NOT used (see docs).
  available_regressors:
    first_day_of_term: calendar
    first_week_of_term: calendar
    exam_period: calendar
    students_enrolled: school_records
  # Stage 1 compares regressor sets; stage 2 tunes the best set. Small on purpose.
  candidates:
    - name: prophet_basic
      regressors: []
    - name: prophet_calendar
      regressors: [first_day_of_term, first_week_of_term, exam_period]
    - name: prophet_calendar_enrollment
      regressors: [first_day_of_term, first_week_of_term, exam_period, students_enrolled]
  base_params:
    weekly_seasonality: true
    yearly_seasonality: true
    daily_seasonality: false
    changepoint_prior_scale: 0.05
    seasonality_mode: additive
  tuning_grid:
    - {changepoint_prior_scale: 0.01}
    - {changepoint_prior_scale: 0.5}
    - {seasonality_mode: multiplicative}

# ---------------------------------------------------------------------------
# Alternative models compared with Prophet (issue #48). Evaluation only: the
# production service keeps serving Prophet. Each family has a few candidates;
# validation picks one per family, which is then tested once like the others.
# ---------------------------------------------------------------------------
seasonal_naive:
  enabled: true                      # same weekday last week

sarima:
  # Series = school days in order, so the weekly season is 5 steps.
  history_school_days: 750           # refit on about three school years at each origin
  candidates:
    - {name: sarima_101_101_5, order: [1, 0, 1], seasonal_order: [1, 0, 1, 5], trend: c}
    - {name: sarima_201_101_5, order: [2, 0, 1], seasonal_order: [1, 0, 1, 5], trend: c}
    - {name: sarima_011_011_5, order: [0, 1, 1], seasonal_order: [0, 1, 1, 5], trend: n}

machine_learning:
  random_seed: 20250901
  random_forest:
    candidates:
      - {name: random_forest_leaf1, n_estimators: 300, min_samples_leaf: 1, max_features: 0.5}
      - {name: random_forest_leaf10, n_estimators: 300, min_samples_leaf: 10, max_features: 0.5}
  gradient_boosting:
    candidates:
      - {name: gradient_boosting_lr005, learning_rate: 0.05, max_iter: 400, max_leaf_nodes: 15}
      - {name: gradient_boosting_lr01, learning_rate: 0.1, max_iter: 200, max_leaf_nodes: 31}

artifacts:
  dir: models/artifacts                     # relative to forecasting/
  model_file: prophet_model.json
  metadata_file: model_metadata.json
  evaluation_json: data/reports/forecast_evaluation.json
  evaluation_report: data/reports/forecast_evaluation_report.md
  evaluation_predictions: data/reports/forecast_evaluation_predictions.csv
